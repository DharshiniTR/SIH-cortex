openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tamil Nadu e-Sevai portal API
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: services
  - name: applications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the portal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid credentials }
  /departments:
    get:
      operationId: listDepartments
      tags: [services]
      summary: List departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Department" }
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Search and filter government services
      parameters:
        - { in: query, name: departmentId, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: letter, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: Services page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePage" }
  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a service
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { description: Not found }
  /applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit an application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
    put:
      operationId: updateApplication
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdate" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
  /applications/{id}/certificate:
    get:
      operationId: getCertificate
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Certificate metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
  /applications/{id}/receipt:
    get:
      operationId: getReceipt
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Receipt metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [applications]
      summary: Get citizen dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    User:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    Department:
      type: object
      required: [id, name, code]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
    Service:
      type: object
      required: [id, code, name, departmentId, departmentName, description, fee, documents, process]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        departmentId: { type: integer }
        departmentName: { type: string }
        description: { type: string }
        fee: { type: number }
        documents: { type: array, items: { type: string } }
        process: { type: array, items: { type: string } }
    ServicePage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    Application:
      type: object
      required: [id, applicationNumber, serviceId, serviceName, applicantName, status, submittedAt, updatedAt]
      properties:
        id: { type: integer }
        applicationNumber: { type: string }
        serviceId: { type: integer }
        serviceName: { type: string }
        applicantName: { type: string }
        status: { type: string }
        submittedAt: { type: string }
        updatedAt: { type: string }
        remarks: { type: ["string", "null"] }
    ApplicationInput:
      type: object
      required: [serviceId, applicantName, phone, address, district, taluk]
      properties:
        serviceId: { type: integer }
        applicantName: { type: string }
        phone: { type: string }
        address: { type: string }
        district: { type: string }
        taluk: { type: string }
    ApplicationUpdate:
      type: object
      required: [applicantName, phone, address, district, taluk]
      properties:
        applicantName: { type: string }
        phone: { type: string }
        address: { type: string }
        district: { type: string }
        taluk: { type: string }
    Certificate:
      type: object
      required: [applicationNumber, certificateNumber, issuedOn, serviceName, applicantName]
      properties:
        applicationNumber: { type: string }
        certificateNumber: { type: string }
        issuedOn: { type: string }
        serviceName: { type: string }
        applicantName: { type: string }
        downloadUrl: { type: string }
    Receipt:
      type: object
      required: [applicationNumber, receiptNumber, amount, paidOn]
      properties:
        applicationNumber: { type: string }
        receiptNumber: { type: string }
        amount: { type: number }
        paidOn: { type: string }
    Dashboard:
      type: object
      required: [totalApplications, pending, completed, returned, recentApplications]
      properties:
        totalApplications: { type: integer }
        pending: { type: integer }
        completed: { type: integer }
        returned: { type: integer }
        recentApplications: { type: array, items: { $ref: "#/components/schemas/Application" } }